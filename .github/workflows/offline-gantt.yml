name: Offline booking example
on:
  pull_request:
    paths:
      - 'Coding/offline-gantt/**'
      - '.github/workflows/offline-gantt.yml'
  push:
    branches: [master]
    paths:
      - 'Coding/offline-gantt/**'
      - '.github/workflows/offline-gantt.yml'
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test Coding/offline-gantt/model.test.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python Coding/offline-gantt/browser_check.py
        env:
          SCREENSHOT_DIR: gantt-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-gantt-screenshots
          path: gantt-screenshots/*.png
          retention-days: 7
